general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Identidad Sentinel (spec 014 US2): virtual key -> tenant/client/tool, fail-closed.
  # El path se resuelve RELATIVO a este archivo (research T005): extensions/ vive
  # al lado del config dentro del contenedor (/app/extensions, ver docker-compose).
  custom_auth: extensions.custom_auth.user_api_key_auth
  # Backstop del motor sobre la identidad retornada (models/rpm/tpm) — Principio VI
  custom_auth_run_common_checks: true
guardrails:
  # Politica Sentinel como CustomGuardrail nativo (spec 014 US1). mode post_call cubre
  # tambien el streaming (async_post_call_streaming_iterator_hook) — research T005.
- guardrail_name: sentinel-guardian
  litellm_params:
    guardrail: extensions.sentinel_guardrail.SentinelGuardrail
    mode: [pre_call, post_call]
    default_on: true
litellm_settings:
  # Audit metadata-only + feed del monitor (spec 014 US3)
  callbacks: extensions.sentinel_audit_logger.sentinel_audit_logger_instance
  cache: true
  cache_params:
    host: os.environ/REDIS_HOST
    port: 6379
    ttl: 3600
    type: redis
  drop_params: true
  set_verbose: false
model_list:
- litellm_params:
    api_base: os.environ/AZURE_API_BASE
    api_key: os.environ/AZURE_API_KEY
    api_version: os.environ/AZURE_API_VERSION
    model: azure/gpt-4o-mini
  model_name: azure-gpt-4o-mini
- litellm_params:
    api_key: os.environ/GEMINI_API_KEY
    model: gemini/gemini-2.5-flash
  model_name: gemini-2.5-flash
- litellm_params:
    api_key: os.environ/GEMINI_API_KEY
    model: gemini/gemini-2.5-flash-lite
  model_name: gemini-2.5-flash-lite
- litellm_params:
    api_key: os.environ/OPENAI_API_KEY
    model: openai/gpt-4o
  model_name: gpt-4o
- litellm_params:
    api_key: os.environ/OPENAI_API_KEY
    model: openai/gpt-4o-mini
  model_name: gpt-4o-mini
- litellm_params:
    api_key: os.environ/ANTHROPIC_API_KEY
    model: anthropic/claude-3-5-sonnet-20240620
  model_name: claude-3-5-sonnet
# Ollama LOCAL sacado del catálogo (31-ago, spec 040 — despliegue de prueba
# multi-usuario): no hay runtime Ollama en este entorno; dejarlo listado permitía
# elegirlo manualmente (o por fallback) y colgaba 30s por request — no aceptable con
# varias personas probando a la vez. La entrada completa (comentario original con el
# contexto del incidente del 30-jul, `max_parallel_requests`, `num_retries: 0`) sigue en
# el historial de git — restaurarla si el deployment de destino sí tiene Ollama corriendo.
# Embeddings del auto-router semántico (spec 030 R1): qwen3-embedding:0.6b LOCAL — el
# contenido del prompt NO puede salir de la máquina para decidir el ruteo (FR-003 +
# residencia). ollama/ (no ollama_chat/): el endpoint es /v1/embeddings, no /api/chat.
# NO es un modelo conversable: se excluye del dropdown del chat por nombre.
# Requiere `ollama pull qwen3-embedding:0.6b` (639 MB) en el host del runtime.
- litellm_params:
    api_base: http://host.docker.internal:11434
    model: ollama/qwen3-embedding:0.6b
  model_info:
    input_cost_per_token: 0
    mode: embedding
    output_cost_per_token: 0
  model_name: router-embeddings
router_settings:
  disable_cooldowns: true
  # Reintentos GLOBALES: sanos contra un proveedor cloud (un 429 se reintenta y listo). El
  # deployment del runtime local los pisa con `num_retries: 0` — contra una cola FIFO que
  # serializa, reintentar es multiplicar el trabajo que ya no entra (#134-②).
  num_retries: 2
  timeout: 30
  # Fallback por modelo — DECIDIDO (JF, 12-ago; ADR-0003): el producto cambia de modelo sólo
  # donde hay un fallback configurado PARA ESE MODELO, como los de acá abajo o los que
  # escribe el panel (feature 010). Sin fallback configurado el error viaja explícito: queda
  # prohibida cualquier degradación hacia un modelo que nadie eligió. Ojo con lo que ya
  # implica esta lista: la sustitución es SILENCIOSA (la respuesta conserva el nombre del
  # modelo pedido), así que cada entrada es una decisión de quien la escribe —acá, de dev.
  fallbacks:
  # 31-ago (sesión de prueba multi-usuario, spec 040): sacado ollama-qwen3-4b de TODAS
  # las cadenas — no hay Ollama corriendo en este entorno, y un fallback ahí cuelga 30s
  # (timeout real observado) en vez de fallar rápido. Cada cadena ahora termina en un
  # modelo con credencial real configurada (azure-gpt-4o-mini o gemini). gpt-4o/
  # gpt-4o-mini quedan en el catálogo (sin OPENAI_API_KEY) pero con fallback real: no
  # deberían pedirse directo, y si se piden, no cuelgan.
  - azure-gpt-4o-mini:
    - gemini-2.5-flash-lite
  - gemini-2.5-flash-lite:
    - azure-gpt-4o-mini
  - gpt-4o:
    - azure-gpt-4o-mini
  - gpt-4o-mini:
    - azure-gpt-4o-mini
  - claude-3-5-sonnet:
    - gemini-2.5-flash
    - azure-gpt-4o-mini
  - gemini-2.5-flash:
    - gemini-2.5-flash-lite
    - azure-gpt-4o-mini