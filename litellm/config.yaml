general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Identidad Basa (spec 014 US2): virtual key -> tenant/client/tool, fail-closed.
  # El path se resuelve RELATIVO a este archivo (research T005): extensions/ vive
  # al lado del config dentro del contenedor (/app/extensions, ver docker-compose).
  custom_auth: extensions.custom_auth.user_api_key_auth
  # Backstop del motor sobre la identidad retornada (models/rpm/tpm) — Principio VI
  custom_auth_run_common_checks: true
guardrails:
  # Politica Basa como CustomGuardrail nativo (spec 014 US1). mode post_call cubre
  # tambien el streaming (async_post_call_streaming_iterator_hook) — research T005.
- guardrail_name: basa-guardian
  litellm_params:
    guardrail: extensions.basa_guardrail.BasaGuardrail
    mode: [pre_call, post_call]
    default_on: true
litellm_settings:
  # Audit metadata-only + feed del monitor (spec 014 US3)
  callbacks: extensions.basa_audit_logger.basa_audit_logger_instance
  cache: true
  cache_params:
    host: os.environ/REDIS_HOST
    port: 6379
    ttl: 3600
    type: redis
  drop_params: true
  set_verbose: false
model_list:
- litellm_params:
    api_base: os.environ/AZURE_API_BASE
    api_key: os.environ/AZURE_API_KEY
    api_version: os.environ/AZURE_API_VERSION
    model: azure/gpt-4o-mini
  model_name: azure-gpt-4o-mini
- litellm_params:
    api_key: os.environ/GEMINI_API_KEY
    model: gemini/gemini-2.5-flash
  model_name: gemini-2.5-flash
- litellm_params:
    api_key: os.environ/GEMINI_API_KEY
    model: gemini/gemini-2.5-flash-lite
  model_name: gemini-2.5-flash-lite
- litellm_params:
    api_key: os.environ/OPENAI_API_KEY
    model: openai/gpt-4o
  model_name: gpt-4o
- litellm_params:
    api_key: os.environ/OPENAI_API_KEY
    model: openai/gpt-4o-mini
  model_name: gpt-4o-mini
- litellm_params:
    api_key: os.environ/ANTHROPIC_API_KEY
    model: anthropic/claude-3-5-sonnet-20240620
  model_name: claude-3-5-sonnet
# Upstream Ollama (spike 019 batch 1, 2026-07-20): modelos propios/locales del cliente.
# ollama_chat/ (no ollama/) porque usa /api/chat y soporta tool-calling; host.docker.internal
# es el host desde el contenedor (Docker Desktop — SOLO dev; en prod el api_base es el host
# ruteable del runtime del cliente). Costo 0: el modelo es del cliente.
# Sin fallback propio a propósito: un fallback local→cloud violaría la residencia de datos
# que motiva tener el modelo local.
# `max_parallel_requests` (issue #151, decisión técnica del #134): SEGUNDO candado, del
# lado del motor. El primero es el tope de admisión del backend (engine_gate.py, 8 en vuelo
# × 2 workers = 16); éste existe para que la cola infinita no vuelva a existir NI AUNQUE el
# backend falle en cortarla —byok por `/gw`, un worker de más, un tope mal girado—, porque el
# runtime local serializa las generaciones y encola FIFO sin límite: ahí empezó el cuelgue de
# la sede del 30-jul. 20 = tope total del backend (16) + margen, a propósito POR ENCIMA: el
# que tiene que rechazar es el backend, con su 503 honesto y auditado, no el motor con un
# error opaco. El motor lo convierte en un `asyncio.Semaphore` por deployment (verificado
# contra la imagen pinneada 1.92.0; lo fija checks/test_engine_local_limits.sh).
# Las embeddings del router NO llevan tope: sale una por chat, y los chats ya vienen
# acotados por el backend — un tope ahí sólo agregaría un modo de degradación nuevo.
#
# `num_retries: 0` (issue #151, decisión #134-② sellada por JF el 12-ago): TERCER candado,
# y el más barato. El `num_retries: 2` global de `router_settings` es sano contra un
# proveedor cloud —un 429 se reintenta y listo—, pero contra un runtime que serializa es
# amplificación: cada generación que expira vuelve a la MISMA cola FIFO dos veces más, o sea
# ×3 trabajo por pedido justo cuando el sistema ya no da abasto. Fue parte del diagnóstico
# del 30-jul. El valor por deployment PISA al global sólo para este upstream (verificado
# contra la imagen pinneada: con el global en 2 son 3 intentos, con este 0 es 1).
# No apaga los FALLBACKS: son otra capa: si el modelo pedido tiene fallback configurado, el
# router sigue cayendo a él después del único intento fallido (ver ADR-0003).
- litellm_params:
    api_base: http://host.docker.internal:11434
    max_parallel_requests: 20
    model: ollama_chat/qwen3:4b
    num_retries: 0
  model_info:
    input_cost_per_token: 0
    output_cost_per_token: 0
  model_name: ollama-qwen3-4b
# Embeddings del auto-router semántico (spec 030 R1): qwen3-embedding:0.6b LOCAL — el
# contenido del prompt NO puede salir de la máquina para decidir el ruteo (FR-003 +
# residencia). ollama/ (no ollama_chat/): el endpoint es /v1/embeddings, no /api/chat.
# NO es un modelo conversable: se excluye del dropdown del chat por nombre.
# Requiere `ollama pull qwen3-embedding:0.6b` (639 MB) en el host del runtime.
- litellm_params:
    api_base: http://host.docker.internal:11434
    model: ollama/qwen3-embedding:0.6b
  model_info:
    input_cost_per_token: 0
    mode: embedding
    output_cost_per_token: 0
  model_name: router-embeddings
router_settings:
  disable_cooldowns: true
  # Reintentos GLOBALES: sanos contra un proveedor cloud (un 429 se reintenta y listo). El
  # deployment del runtime local los pisa con `num_retries: 0` — contra una cola FIFO que
  # serializa, reintentar es multiplicar el trabajo que ya no entra (#134-②).
  num_retries: 2
  timeout: 30
  # Fallback por modelo — DECIDIDO (JF, 12-ago; ADR-0003): el producto cambia de modelo sólo
  # donde hay un fallback configurado PARA ESE MODELO, como los de acá abajo o los que
  # escribe el panel (feature 010). Sin fallback configurado el error viaja explícito: queda
  # prohibida cualquier degradación hacia un modelo que nadie eligió. Ojo con lo que ya
  # implica esta lista: la sustitución es SILENCIOSA (la respuesta conserva el nombre del
  # modelo pedido), así que cada entrada es una decisión de quien la escribe —acá, de dev.
  fallbacks:
  - azure-gpt-4o-mini:
    - ollama-qwen3-4b
  - gemini-2.5-flash-lite:
    - ollama-qwen3-4b
  - gpt-4o:
    - azure-gpt-4o-mini
    - ollama-qwen3-4b
  - gpt-4o-mini:
    - ollama-qwen3-4b
  - claude-3-5-sonnet:
    - gemini-2.5-flash
    - ollama-qwen3-4b
  - gemini-2.5-flash:
    - gemini-2.5-flash-lite
    - ollama-qwen3-4b