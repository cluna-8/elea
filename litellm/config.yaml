general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Identidad Basa (spec 014 US2): virtual key -> tenant/client/tool, fail-closed.
  # El path se resuelve RELATIVO a este archivo (research T005): extensions/ vive
  # al lado del config dentro del contenedor (/app/extensions, ver docker-compose).
  custom_auth: extensions.custom_auth.user_api_key_auth
  # Backstop del motor sobre la identidad retornada (models/rpm/tpm) — Principio VI
  custom_auth_run_common_checks: true
guardrails:
  # Politica Basa como CustomGuardrail nativo (spec 014 US1). mode post_call cubre
  # tambien el streaming (async_post_call_streaming_iterator_hook) — research T005.
- guardrail_name: basa-guardian
  litellm_params:
    guardrail: extensions.basa_guardrail.BasaGuardrail
    mode: [pre_call, post_call]
    default_on: true
litellm_settings:
  # Audit metadata-only + feed del monitor (spec 014 US3)
  callbacks: extensions.basa_audit_logger.basa_audit_logger_instance
  cache: true
  cache_params:
    host: os.environ/REDIS_HOST
    port: 6379
    ttl: 3600
    type: redis
  drop_params: true
  set_verbose: false
model_list:
- litellm_params:
    api_base: os.environ/AZURE_API_BASE
    api_key: os.environ/AZURE_API_KEY
    api_version: os.environ/AZURE_API_VERSION
    model: azure/gpt-4o-mini
  model_name: azure-gpt-4o-mini
- litellm_params:
    api_key: os.environ/GEMINI_API_KEY
    model: gemini/gemini-2.5-flash
  model_name: gemini-2.5-flash
- litellm_params:
    api_key: os.environ/GEMINI_API_KEY
    model: gemini/gemini-2.5-flash-lite
  model_name: gemini-2.5-flash-lite
- litellm_params:
    api_key: os.environ/OPENAI_API_KEY
    model: openai/gpt-4o
  model_name: gpt-4o
- litellm_params:
    api_key: os.environ/OPENAI_API_KEY
    model: openai/gpt-4o-mini
  model_name: gpt-4o-mini
- litellm_params:
    api_key: os.environ/ANTHROPIC_API_KEY
    model: anthropic/claude-3-5-sonnet-20240620
  model_name: claude-3-5-sonnet
- litellm_params:
    api_base: http://172.26.0.1:11434
    model: ollama/gemma4:31b-cloud
  model_info:
    input_cost_per_token: 0
    output_cost_per_token: 0
  model_name: ollama-gemma4-31b
- litellm_params:
    api_base: http://172.26.0.1:11434
    model: ollama/qwen3.5:2b
  model_info:
    input_cost_per_token: 0
    output_cost_per_token: 0
  model_name: ollama-qwen3-2b
router_settings:
  disable_cooldowns: true
  num_retries: 2
  timeout: 30
  fallbacks:
  - azure-gpt-4o-mini:
    - ollama-qwen3-2b
  - gemini-2.5-flash-lite:
    - ollama-qwen3-2b
  - gpt-4o:
    - azure-gpt-4o-mini
    - ollama-qwen3-2b
  - gpt-4o-mini:
    - ollama-qwen3-2b
  - claude-3-5-sonnet:
    - gemini-2.5-flash
    - ollama-qwen3-2b
  - gemini-2.5-flash:
    - gemini-2.5-flash-lite
    - ollama-qwen3-2b
  - ollama-gemma4-31b:
    - ollama-qwen3-2b