litellm_settings:
  drop_params: true
  set_verbose: true
  cache: true
  cache_params:
    type: redis
    host: "os.environ/REDIS_HOST"
    port: 6379
    ttl: 3600

router_settings:
  disable_cooldowns: true

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
