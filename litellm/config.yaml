general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Identidad Sentinel (spec 014 US2): virtual key -> tenant/client/tool, fail-closed.
  # El path se resuelve RELATIVO a este archivo (research T005): extensions/ vive
  # al lado del config dentro del contenedor (/app/extensions, ver docker-compose).
  custom_auth: extensions.custom_auth.user_api_key_auth
  # Backstop del motor sobre la identidad retornada (models/rpm/tpm) — Principio VI
  custom_auth_run_common_checks: true
guardrails:
  # Politica Sentinel como CustomGuardrail nativo (spec 014 US1). mode post_call cubre
  # tambien el streaming (async_post_call_streaming_iterator_hook) — research T005.
- guardrail_name: sentinel-guardian
  litellm_params:
    guardrail: extensions.sentinel_guardrail.SentinelGuardrail
    mode: [pre_call, post_call]
    default_on: true
litellm_settings:
  # Audit metadata-only + feed del monitor (spec 014 US3)
  callbacks: extensions.sentinel_audit_logger.sentinel_audit_logger_instance
  cache: true
  cache_params:
    host: os.environ/REDIS_HOST
    port: 6379
    ttl: 3600
    type: redis
  drop_params: true
  set_verbose: false
# Catálogo alineado a producción (31-ago): 3 deployments reales de Azure OpenAI +
# embeddings también en Azure (antes local vía Ollama, causaba fallos del auto-router
# — ver auto_router.json). Sacados gemini/openai/claude/ollama del catálogo de
# desarrollo: no son los que corren en producción, mantenerlos vivos acá invitaba a
# probar contra un catálogo que no es el real.
model_list:
- litellm_params:
    api_base: os.environ/AZURE_API_BASE
    api_key: os.environ/AZURE_API_KEY
    api_version: os.environ/AZURE_API_VERSION
    model: azure/gpt-4o-mini
  model_name: azure-gpt-4o-mini
- litellm_params:
    api_base: os.environ/AZURE_API_BASE
    api_key: os.environ/AZURE_API_KEY
    api_version: os.environ/AZURE_API_VERSION
    model: azure/gpt-5.1-chat
  model_info:
    # Precios reales de producción (panel Modelos & Ollama, 31-ago) — este deployment
    # es nuevo, el mapa de costos embebido de litellm puede no traerlo todavía.
    input_cost_per_token: 0.00000125
    output_cost_per_token: 0.00001
  model_name: azure-gpt-5.1-chat
- litellm_params:
    api_base: os.environ/AZURE_API_BASE
    api_key: os.environ/AZURE_API_KEY
    api_version: os.environ/AZURE_API_VERSION
    model: azure/gpt-5.4-mini
  model_info:
    input_cost_per_token: 0.00000075
    output_cost_per_token: 0.0000045
  model_name: azure-gpt-5.4-mini
# Embeddings del auto-router semántico (spec 030 R1) — Azure OpenAI real (antes Ollama
# local, ver historial de git: causaba "Auto-router: fallo al embeber" porque no hay
# runtime Ollama en este entorno). NO es un modelo conversable: se excluye del
# dropdown del chat por nombre. Gratis en el panel = cost fields en 0 a propósito
# (el ruteo semántico no se factura al tenant).
- litellm_params:
    api_base: os.environ/AZURE_API_BASE
    api_key: os.environ/AZURE_API_KEY
    api_version: os.environ/AZURE_API_VERSION
    model: azure/text-embedding-3-large
  model_info:
    input_cost_per_token: 0
    mode: embedding
    output_cost_per_token: 0
  model_name: router-embeddings
router_settings:
  disable_cooldowns: true
  # Reintentos GLOBALES: sanos contra un proveedor cloud (un 429 se reintenta y listo). El
  # deployment del runtime local los pisa con `num_retries: 0` — contra una cola FIFO que
  # serializa, reintentar es multiplicar el trabajo que ya no entra (#134-②).
  num_retries: 2
  timeout: 30
  # Fallback por modelo — DECIDIDO (JF, 12-ago; ADR-0003): el producto cambia de modelo sólo
  # donde hay un fallback configurado PARA ESE MODELO, como los de acá abajo o los que
  # escribe el panel (feature 010). Sin fallback configurado el error viaja explícito: queda
  # prohibida cualquier degradación hacia un modelo que nadie eligió. Ojo con lo que ya
  # implica esta lista: la sustitución es SILENCIOSA (la respuesta conserva el nombre del
  # modelo pedido), así que cada entrada es una decisión de quien la escribe —acá, de dev.
  #
  # 31-ago: alineado a producción — los dos "mini" (más chicos/baratos) se cubren entre
  # sí; azure-gpt-5.1-chat (el modelo grande) queda SIN fallback, igual que en el panel
  # real ("Sin fallback"), decisión explícita del usuario (no degradar silenciosamente
  # hacia un modelo más chico cuando se pidió el grande a propósito).
  fallbacks:
  - azure-gpt-4o-mini:
    - azure-gpt-5.4-mini
  - azure-gpt-5.4-mini:
    - azure-gpt-4o-mini
