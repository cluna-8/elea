<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  body { width: 320px; margin: 0; background: #0b0f19; color: #e5e7eb;
         font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid #1f2937; }
  header b { color: #fff; font-size: 14px; }
  header .ver { margin-left: auto; color: #6b7280; font-size: 11px; }
  .body { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  label { color: #9ca3af; font-size: 11px; display: block; margin-bottom: 4px; }
  input[type=text], input[type=password] { width: 100%; box-sizing: border-box; background: #111827;
         border: 1px solid #374151; border-radius: 8px; color: #e5e7eb; padding: 7px 9px; font: inherit; }
  button { background: #2563eb; color: #fff; border: 0; border-radius: 8px; padding: 8px 12px;
           font: inherit; font-weight: 600; cursor: pointer; }
  button.secondary { background: #1f2937; color: #cbd5e1; }
  button:disabled { opacity: .4; cursor: default; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row .spacer { margin-left: auto; }
  .status { border-radius: 8px; padding: 9px 10px; font-size: 12px; }
  .status.on  { background: #052e1a; border: 1px solid #14532d; color: #86efac; }
  .status.off { background: #2a0f12; border: 1px solid #7f1d1d; color: #fca5a5; }
  .muted { color: #6b7280; font-size: 11px; }
  .hidden { display: none; }
</style>
</head>
<body>
  <header>
    <span style="font-size:16px">🛡️</span><b>Basa Guard</b><span id="ver" class="ver"></span>
  </header>
  <div class="body">
    <div id="status" class="status off">Desconectado — configurá tu API key para usar la IA.</div>

    <!-- Vista principal: sólo conectar / desconectar / configurar. La key y el
         gateway no viven acá: son un setup de una vez, no algo que se mire. -->
    <div id="view-main">
      <div class="row">
        <button id="connect">Conectar</button>
        <button id="disconnect" class="secondary">Desconectar</button>
        <button id="open-config" class="secondary spacer" title="Configurar">⚙</button>
      </div>
    </div>

    <!-- Vista de configuración -->
    <div id="view-config" class="hidden">
      <div>
        <label>API key</label>
        <input id="key" type="password" placeholder="sk-basa-...">
      </div>
      <div style="margin-top:8px">
        <label>Gateway</label>
        <input id="gw" type="text" placeholder="https://gateway.ejemplo.org/api/v1/gw">
      </div>
      <div class="row" style="margin-top:10px">
        <button id="save">Guardar y conectar</button>
        <button id="cancel" class="secondary">Cancelar</button>
      </div>
    </div>

    <div class="muted">La protección no se puede desactivar. Vos seguís viendo tus datos
      completos en el chat; el proveedor recibe la versión enmascarada.</div>
  </div>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
