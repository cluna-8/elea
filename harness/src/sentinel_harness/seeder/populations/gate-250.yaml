# Población del gate 250 (spec 035, T020; data-model §Población/Seed, research R5).
#
# Aritmética R5 (verificada por test_seeder.py):
#   238 client + 8 tenant_admin + 4 compliance_officer = 250  (== gate)
#   seats (= client = llaves) = 238 ≤ 300 (licencia del examen) con headroom.
#
# El gate 250 añade la tormenta de login (login_storm) en el guion k6; a nivel de
# población es la misma forma que el 125, escalada. Ver gate-125.yaml para el detalle
# de client_type/tool_type/budgets.
gate: 250
tenant: itv-examen
seed_prefix: itv
email_domain: itv-examen.example

license:
  expected_max_seats: 300

admin_bootstrap:
  username: admin

roles:
  tenant_admin:
    count: 8
  compliance_officer:
    count: 4
  client:
    buckets:
      - client_type: chat_ui
        tool_type: chat-ui
        count: 150
      - client_type: desktop
        tool_type: claude-desktop
        count: 63
      - client_type: base_url
        tool_type: claude-code
        count: 25

budgets:
  default:
    max_spend_usd: 10000
    max_tokens: 100000000
    reset_period: monthly
  cohort_402_pct: 2
  cohort_402:
    max_spend_usd: 0.01
    max_tokens: 100
    reset_period: monthly
