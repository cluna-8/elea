version: '3.8'

# STACK_PREFIX aísla container_name entre worktrees en el mismo demonio Docker.
# Default `basa` → los lectores (`docker exec basa-db`, `docker exec basa-litellm`)
# siguen funcionando. En un worktree paralelo: STACK_PREFIX=jeff223 docker compose up.
# `-p` NO basta: solo scopea red/volúmenes. Los puertos de host siguen globales
# (5433/8091/8090/4010); si chocan, override local de `ports` (no de nombres).
# Convención: CONTRIBUTING.md § Entorno local + tech-team/DevFlow-BasaGuardian.md § 8.

services:
  db:
    image: postgres:16-alpine
    container_name: ${STACK_PREFIX:-basa}-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-basa_gateway}
      POSTGRES_USER: ${POSTGRES_USER:-basa_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-basasecurepass123}
    ports:
      # 5433 en el host: 5432 lo ocupa el repo demo (gatelite) que debe seguir corriendo en paralelo
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - basa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-basa_admin} -d ${POSTGRES_DB:-basa_gateway}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ${STACK_PREFIX:-basa}-redis
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - basa-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nlp-analyzer:
    # Motor de detección NLP real (spec 016) — sidecar propio, español. Sin puerto
    # publicado al host: solo lo consumen litellm/backend dentro de basa-network.
    # Naming neutro (Principio VII): nombre de servicio/hostname sin marca de terceros
    # (el directorio de build sigue llamándose presidio-analyzer/ — detalle interno de
    # repo, no publicado; hallazgo del gate check-docs: el hostname SÍ se filtraba a
    # la doc pública vía el valor default de NLP_ANALYZER_URL en configuration.md).
    build:
      context: ./presidio-analyzer
      dockerfile: Dockerfile
    container_name: ${STACK_PREFIX:-basa}-nlp-analyzer
    networks:
      - basa-network
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:3000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  litellm:
    # PIN por digest (spec 014 T004/FR-026, Principio VI): litellm 1.92.0.
    # Proceso de bump: cambiar el digest -> correr la suite de contract tests
    # (tests/contract/) -> si pasa, commitear; NUNCA reescribir los hooks a ciegas.
    image: ghcr.io/berriai/litellm:main-latest@sha256:80ea654c506da9083503d00c1b323b2fecddf17af6add9bf01b2603938e17bd2
    container_name: ${STACK_PREFIX:-basa}-litellm
    ports:
      # 4010 en el host: 4000 lo ocupa el litellm del repo demo (gatelite)
      - "4010:4000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-basa_admin}:${POSTGRES_PASSWORD:-basasecurepass123}@db:5432/${POSTGRES_DB:-basa_gateway}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-basa_master_key_9999}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AZURE_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_API_BASE=${AZURE_OPENAI_ENDPOINT}
      - AZURE_API_VERSION=${AZURE_API_VERSION}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # nombre de servicio compose (DNS interno de la red), no container_name
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LITELLM_LOG=INFO
      # Motor NLP real (spec 016) — nombre de servicio compose, puerto interno del app.py
      - NLP_ANALYZER_URL=http://nlp-analyzer:3000
      - BASA_ENTITY_REGION=${BASA_ENTITY_REGION:-eu}
      # Política de fallo de auditoría (spec 031, contrato §Config). Misma env y mismo
      # valor que el backend: si una instalación exige `closed`, el motor no puede
      # quedarse en `open` y seguir sirviendo byok inauditable.
      - BASA_AUDIT_FAIL=${BASA_AUDIT_FAIL:-open}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
      # Extensiones Basa (spec 014): custom_auth se resuelve relativo al config.yaml
      - ./litellm/extensions:/app/extensions
    entrypoint: ["litellm", "--config", "/app/config.yaml"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      nlp-analyzer:
        condition: service_healthy
    networks:
      - basa-network
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:4000/health/readiness\")' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${STACK_PREFIX:-basa}-backend
    ports:
      # 8091 en el host: 8081 lo ocupa el backend del repo demo (gatelite)
      - "8091:8000"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-basa_gateway}
      - POSTGRES_USER=${POSTGRES_USER:-basa_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-basasecurepass123}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LITELLM_API_BASE=http://litellm:4000
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-basa_master_key_9999}
      # ── Admisión hacia el motor (nodo C1, issue #151) ──────────────────────────
      # Passthrough con los MISMOS defaults del código: en dev no cambia nada de
      # comportamiento, pero las perillas del .env.example dejan de ser decorativas
      # (sin estas líneas, ponerlas en el `.env` no llega al contenedor y el operador
      # cree que giró algo). El rango lo sigue imponiendo engine_gate.py.
      - BASA_ENGINE_MAX_CONCURRENCY=${BASA_ENGINE_MAX_CONCURRENCY:-8}
      - BASA_ENGINE_QUEUE_TIMEOUT_SECONDS=${BASA_ENGINE_QUEUE_TIMEOUT_SECONDS:-5}
      - BASA_ENGINE_TIMEOUT_SECONDS=${BASA_ENGINE_TIMEOUT_SECONDS:-60}
      - BASA_GW_BYOK_TIMEOUT_SECONDS=${BASA_GW_BYOK_TIMEOUT_SECONDS:-150}
      - BASA_GW_BYOK_READ_TIMEOUT_SECONDS=${BASA_GW_BYOK_READ_TIMEOUT_SECONDS:-150}
      # ── Purga de retención (spec 018, FR-001) ──────────────────────────────────
      # Mismo criterio que el bloque de admisión de arriba: passthrough con los
      # defaults del plan para que las perillas del .env.example no sean decorativas
      # (sin estas líneas, ponerlas en el `.env` no llega al contenedor y el operador
      # cree que giró algo). El consumidor entra con 018 US1.
      #
      # Las dos primeras NO llevan el default del plan, llevan el seguro: apagado y
      # en simulacro. Un job de DELETE retroactivo no se enciende con un pull de
      # imagen — el día que el purgador exista, esto arranca sin borrar nada hasta
      # que alguien lo pida por runbook. Hasta acá también llega el dev que corre
      # `docker compose up` sobre su base con meses de tráfico de pruebas.
      - BASA_PURGE_ENABLED=${BASA_PURGE_ENABLED:-false}
      - BASA_PURGE_DRY_RUN=${BASA_PURGE_DRY_RUN:-true}
      - BASA_PURGE_INTERVAL_SECONDS=${BASA_PURGE_INTERVAL_SECONDS:-3600}
      - BASA_PURGE_WINDOW=${BASA_PURGE_WINDOW:-02:00-05:00}
      - BASA_PURGE_WINDOW_TZ=${BASA_PURGE_WINDOW_TZ:-Europe/Madrid}
      - BASA_PURGE_BATCH_SIZE=${BASA_PURGE_BATCH_SIZE:-5000}
      - BASA_PURGE_BATCH_PAUSE_MS=${BASA_PURGE_BATCH_PAUSE_MS:-200}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AZURE_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_API_BASE=${AZURE_OPENAI_ENDPOINT}
      - AZURE_API_VERSION=${AZURE_API_VERSION}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FERNET_SECRET_KEY=${FERNET_SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      # spec 021: licencia OFFLINE (fail-closed). En dev/demo apunta a la
      # licencia dev del repo; en un deploy real la 020 inyecta el .lic del
      # cliente (y BASA_DEPLOYMENT_TENANT_ID) como secret — nunca este default.
      - BASA_LICENSE_TOKEN_FILE=${BASA_LICENSE_TOKEN_FILE:-/app/config/licenses/dev-demo.lic}
      # Opt-in EXPLÍCITO a claves dev (kid basa-dev-*): sin esta variable, el
      # producto rechaza la licencia dev pública del repo (guard anti-neutralización
      # del fail-closed). Una imagen prod jamás la setea.
      - BASA_ALLOW_DEV_LICENSE=${BASA_ALLOW_DEV_LICENSE:-true}
      - NLP_ANALYZER_URL=http://nlp-analyzer:3000
      # Región de patrones estructurados, default DE LA INSTALACIÓN (spec 016 + extensión
      # países reales, #137/#141). El backend hostea `/gw`, `/gw/inspect` (navegador) y el
      # Playground —los otros tres planos además del byok que resuelve litellm— y hasta
      # este fix no la recibía: `gateway.py` lee `os.environ.get("BASA_ENTITY_REGION", …)`
      # contra un env que nunca le llegaba, así que esos tres planos SIEMPRE resolvían al
      # default del código (eu), sin importar la región que eligiera la instalación —
      # un tenant `latam_ar` enmascaraba DNI/CUIL por byok y NO por los otros tres planos.
      # Mismo valor que `litellm` arriba: los dos servicios tienen que resolver la MISMA
      # región de instalación o el mismo texto detecta entidades distintas según el plano
      # por el que entró.
      - BASA_ENTITY_REGION=${BASA_ENTITY_REGION:-eu}
      # Política de fallo de auditoría (spec 031): `open` en dev — el fallo se cuenta y
      # se ve, pero no corta. Para ejercitar el 503 honesto: BASA_AUDIT_FAIL=closed.
      - BASA_AUDIT_FAIL=${BASA_AUDIT_FAIL:-open}
    volumes:
      - ./backend:/app
      - ./litellm:/app/litellm_config
    depends_on:
      db:
        condition: service_healthy
      litellm:
        condition: service_healthy
    networks:
      - basa-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${STACK_PREFIX:-basa}-frontend
    ports:
      # 8090 en el host: 8080 lo ocupa el frontend del repo demo (gatelite)
      - "8090:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - basa-network
    depends_on:
      - backend

networks:
  basa-network:
    driver: bridge

volumes:
  pgdata:
