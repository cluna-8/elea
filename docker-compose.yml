version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: eu-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-basa_gateway}
      POSTGRES_USER: ${POSTGRES_USER:-basa_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-basasecurepass123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - basa-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-basa_admin} -d ${POSTGRES_DB:-basa_gateway}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eu-redis
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - basa-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: eu-litellm
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-basa_admin}:${POSTGRES_PASSWORD:-basasecurepass123}@db:5432/${POSTGRES_DB:-basa_gateway}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-basa_master_key_9999}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AZURE_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_API_BASE=${AZURE_OPENAI_ENDPOINT}
      - AZURE_API_VERSION=${AZURE_API_VERSION}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_HOST=eu-redis
      - REDIS_PORT=6379
      - LITELLM_LOG=INFO
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    entrypoint: ["litellm", "--config", "/app/config.yaml"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - basa-network
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:4000/health/readiness\")' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eu-backend
    ports:
      - "8081:8000"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-basa_gateway}
      - POSTGRES_USER=${POSTGRES_USER:-basa_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-basasecurepass123}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - LITELLM_API_BASE=http://litellm:4000
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-basa_master_key_9999}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AZURE_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_API_BASE=${AZURE_OPENAI_ENDPOINT}
      - AZURE_API_VERSION=${AZURE_API_VERSION}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FERNET_SECRET_KEY=${FERNET_SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    volumes:
      - ./backend:/app
      - ./litellm:/app/litellm_config
    depends_on:
      db:
        condition: service_healthy
      litellm:
        condition: service_healthy
    networks:
      - basa-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eu-frontend
    ports:
      - "8080:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - basa-network
    depends_on:
      - backend

networks:
  basa-network:
    driver: bridge

volumes:
  pgdata:
