# Config BASE marca-neutra del sitio de documentación de producto (spec 022).
# La marca de un distribuidor entra por overlay `INHERIT` (mkdocs.<brand>.yml derivado del
# brand-pack de la 020) — este archivo y el contenido JAMÁS se editan por marca (Principio VII).
# docs_dir = ./docs: los internos del repo (docs/COORDINATION-*.md, docs/retros/) quedan FUERA
# del sitio por construcción (anti-fuga de contexto interno, FR-018 + delta F4).

site_name: Basa Secure AI Gateway
site_description: Documentación de producto para distribuidores y operadores
# site_url removido (issue #288): el plugin privacy horneaba URLs absolutas
# a http://localhost:8092/ (puerto que nadie sirve en producción) para assets
# vendorizados como mermaid.min.js. Sin site_url, mkdocs resuelve con rutas
# relativas al origen real, sin acoplar la imagen al puerto ni al dominio.

docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: es
  icon:
    logo: material/shield-check
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Modo oscuro
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

extra_css:
  - assets/brand/extra.css

extra:
  generator: false # sin footer "Made with Material for MkDocs" (naming neutro del artefacto publicado)
  version:
    provider: mike # selector de versión por release (US6, FR-019)

plugins:
  - search:
      lang:
        - es
        - en
  - privacy # embebe cualquier asset externo en build (air-gap, FR-003)
  - offline # el sitio (búsqueda incluida) funciona desde file:// y sin backend (FR-002/FR-014)
  - i18n: # ES primario, EN con fallback explícito al primario — jamás 404 (US6, FR-020)
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: es
          name: Español
          default: true
          build: true
        - locale: en
          name: English
          build: true
  - swagger-ui-tag # API reference embebido, assets locales (US5 — 0 egress)

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Overview & arquitectura: overview/index.md
  - Install / Deploy:
      - Install / Deploy: install-deploy/index.md
      - Infraestructura: install-deploy/infrastructure.md
      - Licenciamiento: install-deploy/licensing.md
      - Inicio de sesión con el directorio (SSO): install-deploy/sso.md
      - Partner enablement: install-deploy/partner-enablement.md
  - White-label & branding: white-label/index.md
  - Administración:
      - Administración: administration/index.md
      - Gobernanza del firewall: administration/gobernanza.md
      - Purga de retención: administration/purga-retencion.md
  - Integraciones & matriz:
      - Integraciones & matriz: integrations/index.md
      - Modelo propio / local: integrations/modelo-propio.md
      - Gotchas verificados: integrations/gotchas.md
  - API reference:
      - API reference: api-reference/index.md
      - Códigos de error: api-reference/errors.md
      - Configuración: api-reference/configuration.md
  - Compliance:
      - Compliance: compliance/index.md
      - DPA · DSR · Retención: compliance/dpa-dsr-retention.md
  - Operaciones & troubleshooting: operations/index.md
  - Release notes: release-notes/index.md
