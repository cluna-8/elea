# nginx del sitio de docs (spec 022 US1, FR-023): estáticos puros, NON-ROOT (:8080,
# pid y temporales en /tmp), y JAMÁS ACME/auto-HTTPS — en air-gap un intento de ACME
# contra Let's Encrypt sería egress; el TLS lo termina el ingress del deploy (020).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # rutas escribibles para el usuario nginx (imagen corre USER nginx)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        error_page 404 /404.html;
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
