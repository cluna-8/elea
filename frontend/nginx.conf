server {
    listen 5173;
    root /usr/share/nginx/html;
    index index.html;

    # El SPA llama /api/v1 y /gw en el MISMO origen (build de prod, ver vite.config.ts) —
    # nginx hace de proxy reverso hacia el backend, dentro de la red del compose.
    location /api/v1 {
        proxy_pass http://backend:8000/api/v1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /gw {
        proxy_pass http://backend:8000/gw;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA: cualquier ruta que no matcheó arriba sirve index.html (routing del lado cliente).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
