[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "basa-admin"
version = "0.1.0"
description = "CLI de partner/cliente - instalacion y operacion offline de un cliente Basa"
requires-python = ">=3.11"
dependencies = [
    "click==8.1.7",
    "cryptography==42.0.8",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "shiv>=1.0.4,<2",
]

[project.scripts]
basa-admin = "basa_admin.__main__:cli"

[tool.setuptools.packages.find]
include = ["basa_admin*"]

[tool.pytest.ini_options]
pythonpath = ["."]
