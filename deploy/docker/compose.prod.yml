# Orquestación de PRODUCCIÓN (spec 020 T011, FR-005) — la que cloud-init levanta
# en la VM (US4) o el operador on-prem tras `docker load` (US6).
#
# Diferencias deliberadas vs el compose de DEV (raíz del repo):
#   - imágenes PINNEADAS por digest (variables ${*_IMAGE}), código horneado, sin bind-mounts de fuente
#   - CERO secretos default: toda variable sensible es ${VAR:?} — falla explícita si falta
#     (los secretos los genera la instalación: US5, SOPS+age)
#   - storage DURABLE: volúmenes nombrados para Postgres/Redis on-prem; en nube, el módulo
#     OpenTofu swapea POSTGRES_*/REDIS_* a gestionados y estos servicios no se levantan
#     (profile "selfhosted")
#   - TLS lo termina el ingress (Caddy, US4) por delante; acá nada escucha en 80/443
#   - bloque de LICENCIA (spec 021, YA implementada): el perfil monta el .lic + claves

services:
  backend:
    image: "${BACKEND_IMAGE:?imagen pinneada por digest (publish.sh)}"
    restart: unless-stopped
    environment:
      POSTGRES_HOST: "${POSTGRES_HOST:?}"
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      POSTGRES_DB: "${POSTGRES_DB:?}"
      POSTGRES_USER: "${POSTGRES_USER:?}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?generado por instalación (US5), jamás default}"
      REDIS_HOST: "${REDIS_HOST:?}"
      # costura → Falime (Factory): el puerto viajaba sólo por default. Se declara explícito
      # para que backend y motor resuelvan el MISMO endpoint — los dos escriben y leen las
      # mismas claves (`basa:audit:*`, `basa:nlp:*`) y apuntar a instancias distintas hace
      # que el health cuente cero mientras el otro plano registra.
      REDIS_PORT: "${REDIS_PORT:-6379}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?generado por instalación (US5)}"
      FERNET_SECRET_KEY: "${FERNET_SECRET_KEY:?generado por instalación (US5)}"
      LITELLM_API_BASE: "http://litellm:4000"
      # ── Admisión hacia el motor (nodo C1, issue #151 / nota N3 del gate de #135) ──
      # Sin estas líneas el tope queda CLAVADO en los defaults del código: una instalación
      # no puede girar nada, y el ajuste que piden los gates 250/500 —y la sede, con su
      # modelo local lento— exigiría una imagen nueva. Los defaults de acá son los del
      # código (engine_gate.py) salvo donde este perfil ya decidía distinto, y el rango de
      # cada perilla lo sigue imponiendo el código: un valor absurdo se ignora con warning,
      # nunca reinstala la cola infinita ni tumba el arranque del worker.
      #
      # Pedidos en vuelo hacia el motor POR PROCESO (1..64). El total de la instalación es
      # este valor × WEB_CONCURRENCY: con los defaults, 8 × 2 = 16 en vuelo.
      BASA_ENGINE_MAX_CONCURRENCY: "${BASA_ENGINE_MAX_CONCURRENCY:-8}"
      # Espera de turno antes del 503 honesto (0 < v <= 60). Corto a propósito: la promesa
      # es «te digo que no rápido». El `Retry-After` del rechazo se deriva de este valor.
      BASA_ENGINE_QUEUE_TIMEOUT_SECONDS: "${BASA_ENGINE_QUEUE_TIMEOUT_SECONDS:-5}"
      # Timeout del backend hacia el motor (030/T018): debe superar al del router del
      # motor (120s con modelos locales lentos) o corta él primero a mitad de un fallback.
      # Por eso este perfil sube el default del código (60) a 150 — el chat de la consola
      # con modelo local es justamente el caso que aquellos 60 s cortaban.
      BASA_ENGINE_TIMEOUT_SECONDS: "${BASA_ENGINE_TIMEOUT_SECONDS:-150}"
      # Timeouts del byok de `/gw` (coding tools), INDEPENDIENTES de los del chat (H3 del
      # gate de #135): total de la llamada no-stream y espera entre chunks del stream. Los
      # dos por encima de los 120 s del router — el que espera aguanta más que el que
      # trabaja, o una respuesta lenta pero buena se convierte en un error nuestro.
      BASA_GW_BYOK_TIMEOUT_SECONDS: "${BASA_GW_BYOK_TIMEOUT_SECONDS:-150}"
      BASA_GW_BYOK_READ_TIMEOUT_SECONDS: "${BASA_GW_BYOK_READ_TIMEOUT_SECONDS:-150}"
      # Política de fallo de auditoría (031, contrato §Config): `open` (default) sirve el
      # tráfico y deja la pérdida CONTADA y visible; `closed` rechaza con 503 honesto
      # mientras la fila durable no se pueda escribir. El default vive acá y en el helper
      # del backend — una instalación que quiera fail-closed lo declara en su perfil.
      BASA_AUDIT_FAIL: "${BASA_AUDIT_FAIL:-open}"
      # ── Purga de retención (018, FR-001) ────────────────────────────────────────
      # Sin estas líneas la retención de una instalación queda CLAVADA en los defaults
      # del código: el DPO del cliente no podría mover la ventana ni el tamaño de lote
      # sin una imagen nueva, y la ventana es justo lo que se ajusta cuando la purga
      # empieza a rozar la hora punta de esa sede. Los rangos los sigue imponiendo el
      # código: un valor absurdo se ignora con warning, no tumba el arranque.
      # ⚠ Perillas declaradas; el purgador que las consume entra con 018 US1.
      #
      # Las dos primeras son la red del primer encendido y por eso NO traen el default
      # del plan: apagado, y en simulacro cuando se encienda. Es el perfil que instala
      # una sede, y una sede lleva meses de tráfico en `audit_logs` — la primera corrida
      # real no purga «lo de ayer», se lleva el backlog entero, y lo borrado no vuelve.
      # Este `.env` queda escrito HOY y la imagen con el purgador adentro llega después:
      # si acá dijera `true`, ese pull encendería solo un DELETE retroactivo sobre datos
      # del cliente sin que nadie hubiera decidido nada. El encendido es un paso del
      # runbook, con reinicio del backend y con el conteo del simulacro ya firmado.
      BASA_PURGE_ENABLED: "${BASA_PURGE_ENABLED:-false}"
      BASA_PURGE_DRY_RUN: "${BASA_PURGE_DRY_RUN:-true}"
      BASA_PURGE_INTERVAL_SECONDS: "${BASA_PURGE_INTERVAL_SECONDS:-3600}"
      # Hora LOCAL de la instalación, no del contenedor (que corre en UTC).
      BASA_PURGE_WINDOW: "${BASA_PURGE_WINDOW:-02:00-05:00}"
      BASA_PURGE_WINDOW_TZ: "${BASA_PURGE_WINDOW_TZ:-Europe/Madrid}"
      BASA_PURGE_BATCH_SIZE: "${BASA_PURGE_BATCH_SIZE:-5000}"
      BASA_PURGE_BATCH_PAUSE_MS: "${BASA_PURGE_BATCH_PAUSE_MS:-200}"
      # El alta de usuarios crea la identidad en el motor con la master key.
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:?generado por instalación (US5)}"
      # Licencia (021): fail-closed — sin esto la creación de seats queda bloqueada.
      BASA_LICENSE_TOKEN_FILE: "/app/config/licenses/client.lic"
      # Solo pilotos/demos con licencia dev (kid basa-dev-*): opt-in explícito.
      # Un cliente con licencia PROD jamás lo setea (default false).
      BASA_ALLOW_DEV_LICENSE: "${BASA_ALLOW_DEV_LICENSE:-false}"
      # Provider keys del cliente (opcionales): la UI de modelos marca
      # is_configured mirando el env del BACKEND — sin el passthrough todo
      # saldría "no configurado" aunque el motor funcione (gotcha del VPS).
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      AZURE_API_KEY: "${AZURE_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # El backend tiene su PROPIO camino de detección (panel/playground, spec 016
      # T028/T029): sin esta variable escanea con las regex de dev y ni siquiera
      # registra el degradado — la rama `else` de guardian_service no deja trigger.
      NLP_ANALYZER_URL: "http://nlp-analyzer:3000"
      # Región de patrones estructurados, default DE LA INSTALACIÓN (spec 016 + extensión
      # países reales, #137/#141). Mismo hallazgo que en el compose de dev: el backend
      # hostea `/gw`, `/gw/inspect` (navegador) y el Playground, y hasta este fix no
      # recibía esta env (sólo `litellm`, abajo) — esos tres planos SIEMPRE resolvían al
      # default del código (eu) sin importar la región de la instalación. Mismo valor que
      # `litellm`: los dos servicios tienen que resolver la MISMA región.
      BASA_ENTITY_REGION: "${BASA_ENTITY_REGION:-eu}"
      BASA_DEPLOYMENT_TENANT_ID: "${BASA_DEPLOYMENT_TENANT_ID:?tenant del deployment (perfil)}"
      BASA_DEPLOYMENT_KEY_FILE: "/app/config/licenses/deployment_key.pem"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-2}"
    volumes:
      - licenses:/app/config/licenses          # .lic (perfil) + deployment key (021, persistente)
      # El MISMO config que consume el motor, en la ruta que el backend lee
      # (/app/litellm_config/config.yaml) y con escritura: el alta de modelos
      # de la UI escribe acá y el motor lo toma en su próximo restart. El
      # sub-path 'mounted' anterior dejaba al backend ciego al catálogo
      # (hallazgo del ensayo — la UI mostraba 'no hay modelos').
      - litellm_config:/app/litellm_config
      # Estado del supervisor del motor (spec 033), SOLO LECTURA: el backend lo
      # sirve por GET /models/status y no tiene por qué poder escribirlo — el
      # único escritor es el supervisor, en el contenedor del motor. El `:ro` es
      # el que hace que «el backend jamás habla con Docker» siga siendo cierto:
      # observa estado por un archivo, no por el daemon.
      - engine_status:/app/engine_status:ro
    depends_on:
      litellm:
        condition: service_started
      nlp-analyzer:
        condition: service_healthy

  frontend:
    image: "${FRONTEND_IMAGE:?imagen pinneada por digest (publish.sh)}"
    restart: unless-stopped
    volumes:
      - branding:/srv/branding:ro              # marca como CONFIG en runtime (US2)

  # Sitio de documentación de producto (spec 022): estático, non-root, 0 egress.
  # Una imagen POR MARCA (basa-docs:<brand>-<version>); el ingress la sirve bajo
  # /docs o docs.<dominio> — jamás escucha en 80/443 ni habla ACME (FR-023).
  docs:
    image: "${DOCS_IMAGE:?imagen del sitio de docs pinneada por marca (022)}"
    restart: unless-stopped
    # Puerto propio (no va por el ingress: los assets del sitio usan rutas absolutas).
    # El botón «Abrir la documentación» de la consola apunta a este puerto.
    ports:
      - "${DOCS_PORT:-8082}:8080"

  # Motor de detección NLP real (spec 016). Sidecar propio, sin puerto publicado:
  # solo lo consume el motor por DNS interno de la red compose. NO es opcional en
  # prod — sin él, `NLP_ANALYZER_URL` queda vacío y el guardrail degrada a regex
  # en SILENCIO (Constraint SC-2 de la 016: el fallback regex es dev/demo, jamás
  # el default de producción). Con la URL puesta y el sidecar caído el guardrail
  # es fail-closed (rechaza la request), que es lo que queremos: ruidoso, no ciego.
  nlp-analyzer:
    image: "${NLP_ANALYZER_IMAGE:?imagen del analizador NLP pinneada por digest (publish.sh, 016)}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:3000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  litellm:
    image: "${LITELLM_IMAGE:?imagen LiteLLM pinneada (014)}"
    restart: unless-stopped
    depends_on:
      nlp-analyzer:
        condition: service_healthy
    environment:
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:?generado por instalación (US5)}"
      # Detección NLP real (016): nombre de servicio compose + puerto interno del
      # sidecar. Sin esta línea el motor enmascara con regex y el cliente no se entera.
      NLP_ANALYZER_URL: "http://nlp-analyzer:3000"
      # costura → Falime (Factory): el motor ESCRIBE en Redis las mismas claves que el
      # backend LEE — contador de eventos de auditoría perdidos (031) y marca de degradación
      # de la detección NLP (#63) —, pero este servicio no recibía `REDIS_HOST`. En nube,
      # donde Redis es gestionado y no existe ningún host llamado `redis`, el motor escribía
      # al vacío y `GET /api/v1/health` reportaba cero degradaciones con el sidecar caído: la
      # promesa central del #63 ("degradar nunca es silencioso") no se cumplía en el perfil
      # que más la necesita. MISMAS variables que consume el backend, para que los dos planos
      # no puedan apuntar a instancias distintas.
      REDIS_HOST: "${REDIS_HOST:?}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      # Región del catálogo de entidades por defecto (eu = España).
      BASA_ENTITY_REGION: "${BASA_ENTITY_REGION:-eu}"
      # Base PROPIA del motor (jamás la del backend): su migrador Prisma aplica
      # un diff DB↔schema en el primer arranque que DROPea tablas ajenas como
      # "drift" — compartir base destruía el esquema del producto (ensayo
      # 2026-07-22). En selfhosted la crea initdb/01-engine-db.sql; en nube,
      # el módulo OpenTofu provisiona ambas bases.
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/${ENGINE_DB:-basa_engine}"
      # Identidad de las Connections: vive en la base del BACKEND, no en la del motor.
      # Sin esta línea `custom_auth` consulta basa_engine, no encuentra api_keys y TODO
      # byok devuelve 401 (detectado 2026-07-27; el ensayo no lo veía porque nunca
      # ejercitó byok). Se pregunta por HTTP y no por SQL porque la imagen upstream del
      # motor no trae driver de Postgres ni instalador (ni pip ni uv) — httpx sí viene.
      # Se autentica con LITELLM_MASTER_KEY, que ambos servicios ya comparten.
      BASA_IDENTITY_URL: "http://backend:8000/api/v1/internal/identity"
      # Auditoría DURABLE del tráfico que atiende el motor (byok): audit_logs vive en la
      # base del backend, así que la fila se emite al plano interno. Sin esta línea el
      # tráfico de herramientas sólo deja la vitrina efímera de Redis — cero registro
      # durable, el gap más caro del core (detectado en el ensayo 2026-07-27).
      BASA_AUDIT_URL: "http://backend:8000/api/v1/internal/audit"
      # Misma política de fallo de auditoría que el backend (031 D4): el motor la
      # necesita para su propio camino (ola 2 — guardrail y logger de auditoría), y el
      # valor TIENE que ser el mismo en ambos contenedores: una instalación fail-closed
      # con el motor en `open` seguiría sirviendo byok inauditable por la puerta de atrás.
      BASA_AUDIT_FAIL: "${BASA_AUDIT_FAIL:-open}"
      # Provider keys DEL CLIENTE (opcionales; viven en secrets.env de la
      # instalación). El alta de modelos referencia os.environ/<VAR> — sin el
      # passthrough el modelo queda dado de alta pero el motor no lo puede usar.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      AZURE_API_KEY: "${AZURE_API_KEY:-}"
      AZURE_API_BASE: "${AZURE_API_BASE:-}"
      AZURE_API_VERSION: "${AZURE_API_VERSION:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # ── Recarga supervisada del motor (spec 033, FR-005) ───────────────────────
      # ⚠ DESLINDE DE NAMESPACE: `BASA_ENGINE_*` ya existía arriba (`:43-51`), pero
      # ESA es la familia de ADMISIÓN hacia el motor y la lee el **backend** en SU
      # contenedor (MAX_CONCURRENCY / QUEUE_TIMEOUT / TIMEOUT, `engine_gate.py`).
      # Estas tres son otra cosa: mismo componente («engine» = motor), PROCESO
      # DISTINTO — las lee el **supervisor** acá adentro. No se pisan y no se
      # comparten: poner una de éstas en el env del backend no hace nada, y
      # viceversa. Documentado igual en client.env.example (T007).
      BASA_ENGINE_AUTORELOAD: "${BASA_ENGINE_AUTORELOAD:-on}"
      BASA_ENGINE_APPLY_DEBOUNCE_SECONDS: "${BASA_ENGINE_APPLY_DEBOUNCE_SECONDS:-5}"
      BASA_ENGINE_DRAIN_SECONDS: "${BASA_ENGINE_DRAIN_SECONDS:-30}"
    volumes:
      - litellm_config:/app/config:ro          # config.yaml templado + extensions (perfil US3)
      # Estado observable del supervisor. ÚNICO volumen donde el motor escribe:
      # su lado de `litellm_config` sigue siendo `:ro` a propósito, así que el
      # supervisor no puede tocar el config ni borrar el sentinel (lo borra el
      # backend). El backend lo monta `:ro` para servir GET /models/status.
      - engine_status:/app/status
    # El entrypoint pasa a ser el SUPERVISOR (spec 033): valida el YAML y recién
    # entonces relanza litellm con drenaje, así un config roto jamás deja el motor
    # caído. Viaja por el mismo canal templado que las extensiones —el volumen
    # `litellm_config`—, no por imagen nueva: la del motor sigue siendo la stock
    # pinneada de arriba. El supervisor lanza `litellm --config …` él mismo.
    # Sin `docker.sock` y sin capabilities nuevas: relanza un proceso HIJO dentro
    # de este contenedor, jamás habla con el daemon (restricción dura de #50, SC-005).
    entrypoint: ["python", "/app/config/supervisor.py"]
    # host-gateway: modelos locales del cliente (runtime en el host de la VM).
    # En Docker Desktop es implícito; en la VM Linux del cliente NO — sin esta
    # línea el modelo local sería inalcanzable en el install real.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Ingress del camino selfhosted: puerta única SPA + API (issue #35, patrón
  #    del VPS). En nube el ingress lo provisiona la 020 US4 (cloud-init) — por
  #    eso vive detrás del profile. La SPA usa /api/v1 relativo y este Caddy lo
  #    enruta al backend en el mismo origen (sin mixed-content, sin puerto fijo).
  ingress:
    profiles: ["selfhosted"]
    image: "${CADDY_IMAGE:-caddy:2-alpine}"
    restart: unless-stopped
    ports:
      - "${INGRESS_HTTP_PORT:-80}:80"
      - "${INGRESS_HTTPS_PORT:-443}:443"
    environment:
      # ":80" = HTTP plano (piloto/LAN); un dominio = TLS automático (ACME).
      INGRESS_HOST: "${INGRESS_HOST:-:80}"
    volumes:
      - ./Caddyfile.ingress:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [backend, frontend]

  # ── SOLO on-prem/air-gap (profile selfhosted): en nube, RDS/ElastiCache via OpenTofu ──
  db:
    profiles: ["selfhosted"]
    image: "${POSTGRES_IMAGE:-postgres:16}"
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?}"
      POSTGRES_USER: "${POSTGRES_USER:?}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"
    volumes:
      - pgdata:/var/lib/postgresql/data        # DURABLE (adiós pgdata efímero de dev)
      - ./initdb:/docker-entrypoint-initdb.d:ro  # crea la base del motor (solo 1er init)

  redis:
    profiles: ["selfhosted"]
    image: "${REDIS_IMAGE:-redis:7-alpine}"
    restart: unless-stopped
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
  licenses:
  litellm_config:
  # Estado del supervisor del motor (spec 033): motor rw, backend ro.
  engine_status:
  branding:
  caddy_data:
