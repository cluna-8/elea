# Orquestación de PRODUCCIÓN (spec 020 T011, FR-005) — la que cloud-init levanta
# en la VM (US4) o el operador on-prem tras `docker load` (US6).
#
# Diferencias deliberadas vs el compose de DEV (raíz del repo):
#   - imágenes PINNEADAS por digest (variables ${*_IMAGE}), código horneado, sin bind-mounts de fuente
#   - CERO secretos default: toda variable sensible es ${VAR:?} — falla explícita si falta
#     (los secretos los genera la instalación: US5, SOPS+age)
#   - storage DURABLE: volúmenes nombrados para Postgres/Redis on-prem; en nube, el módulo
#     OpenTofu swapea POSTGRES_*/REDIS_* a gestionados y estos servicios no se levantan
#     (profile "selfhosted")
#   - TLS lo termina el ingress (Caddy, US4) por delante; acá nada escucha en 80/443
#   - bloque de LICENCIA (spec 021, YA implementada): el perfil monta el .lic + claves

services:
  backend:
    image: "${BACKEND_IMAGE:?imagen pinneada por digest (publish.sh)}"
    restart: unless-stopped
    environment:
      POSTGRES_HOST: "${POSTGRES_HOST:?}"
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      POSTGRES_DB: "${POSTGRES_DB:?}"
      POSTGRES_USER: "${POSTGRES_USER:?}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?generado por instalación (US5), jamás default}"
      REDIS_HOST: "${REDIS_HOST:?}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?generado por instalación (US5)}"
      FERNET_SECRET_KEY: "${FERNET_SECRET_KEY:?generado por instalación (US5)}"
      LITELLM_API_BASE: "http://litellm:4000"
      # Timeout del backend hacia el motor (030/T018): debe superar al del router del
      # motor (120s con modelos locales lentos) o corta él primero a mitad de un fallback.
      BASA_ENGINE_TIMEOUT_SECONDS: "${BASA_ENGINE_TIMEOUT_SECONDS:-150}"
      # El alta de usuarios crea la identidad en el motor con la master key.
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:?generado por instalación (US5)}"
      # Licencia (021): fail-closed — sin esto la creación de seats queda bloqueada.
      BASA_LICENSE_TOKEN_FILE: "/app/config/licenses/client.lic"
      # Solo pilotos/demos con licencia dev (kid basa-dev-*): opt-in explícito.
      # Un cliente con licencia PROD jamás lo setea (default false).
      BASA_ALLOW_DEV_LICENSE: "${BASA_ALLOW_DEV_LICENSE:-false}"
      # Provider keys del cliente (opcionales): la UI de modelos marca
      # is_configured mirando el env del BACKEND — sin el passthrough todo
      # saldría "no configurado" aunque el motor funcione (gotcha del VPS).
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      AZURE_API_KEY: "${AZURE_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # El backend tiene su PROPIO camino de detección (panel/playground, spec 016
      # T028/T029): sin esta variable escanea con las regex de dev y ni siquiera
      # registra el degradado — la rama `else` de guardian_service no deja trigger.
      NLP_ANALYZER_URL: "http://nlp-analyzer:3000"
      BASA_DEPLOYMENT_TENANT_ID: "${BASA_DEPLOYMENT_TENANT_ID:?tenant del deployment (perfil)}"
      BASA_DEPLOYMENT_KEY_FILE: "/app/config/licenses/deployment_key.pem"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-2}"
    volumes:
      - licenses:/app/config/licenses          # .lic (perfil) + deployment key (021, persistente)
      # El MISMO config que consume el motor, en la ruta que el backend lee
      # (/app/litellm_config/config.yaml) y con escritura: el alta de modelos
      # de la UI escribe acá y el motor lo toma en su próximo restart. El
      # sub-path 'mounted' anterior dejaba al backend ciego al catálogo
      # (hallazgo del ensayo — la UI mostraba 'no hay modelos').
      - litellm_config:/app/litellm_config
    depends_on:
      litellm:
        condition: service_started
      nlp-analyzer:
        condition: service_healthy

  frontend:
    image: "${FRONTEND_IMAGE:?imagen pinneada por digest (publish.sh)}"
    restart: unless-stopped
    volumes:
      - branding:/srv/branding:ro              # marca como CONFIG en runtime (US2)

  # Sitio de documentación de producto (spec 022): estático, non-root, 0 egress.
  # Una imagen POR MARCA (basa-docs:<brand>-<version>); el ingress la sirve bajo
  # /docs o docs.<dominio> — jamás escucha en 80/443 ni habla ACME (FR-023).
  docs:
    image: "${DOCS_IMAGE:?imagen del sitio de docs pinneada por marca (022)}"
    restart: unless-stopped

  # Motor de detección NLP real (spec 016). Sidecar propio, sin puerto publicado:
  # solo lo consume el motor por DNS interno de la red compose. NO es opcional en
  # prod — sin él, `NLP_ANALYZER_URL` queda vacío y el guardrail degrada a regex
  # en SILENCIO (Constraint SC-2 de la 016: el fallback regex es dev/demo, jamás
  # el default de producción). Con la URL puesta y el sidecar caído el guardrail
  # es fail-closed (rechaza la request), que es lo que queremos: ruidoso, no ciego.
  nlp-analyzer:
    image: "${NLP_ANALYZER_IMAGE:?imagen del analizador NLP pinneada por digest (publish.sh, 016)}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:3000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  litellm:
    image: "${LITELLM_IMAGE:?imagen LiteLLM pinneada (014)}"
    restart: unless-stopped
    depends_on:
      nlp-analyzer:
        condition: service_healthy
    environment:
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:?generado por instalación (US5)}"
      # Detección NLP real (016): nombre de servicio compose + puerto interno del
      # sidecar. Sin esta línea el motor enmascara con regex y el cliente no se entera.
      NLP_ANALYZER_URL: "http://nlp-analyzer:3000"
      # Región del catálogo de entidades por defecto (eu = España).
      BASA_ENTITY_REGION: "${BASA_ENTITY_REGION:-eu}"
      # Base PROPIA del motor (jamás la del backend): su migrador Prisma aplica
      # un diff DB↔schema en el primer arranque que DROPea tablas ajenas como
      # "drift" — compartir base destruía el esquema del producto (ensayo
      # 2026-07-22). En selfhosted la crea initdb/01-engine-db.sql; en nube,
      # el módulo OpenTofu provisiona ambas bases.
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT:-5432}/${ENGINE_DB:-basa_engine}"
      # Identidad de las Connections: vive en la base del BACKEND, no en la del motor.
      # Sin esta línea `custom_auth` consulta basa_engine, no encuentra api_keys y TODO
      # byok devuelve 401 (detectado 2026-07-27; el ensayo no lo veía porque nunca
      # ejercitó byok). Se pregunta por HTTP y no por SQL porque la imagen upstream del
      # motor no trae driver de Postgres ni instalador (ni pip ni uv) — httpx sí viene.
      # Se autentica con LITELLM_MASTER_KEY, que ambos servicios ya comparten.
      BASA_IDENTITY_URL: "http://backend:8000/api/v1/internal/identity"
      # Auditoría DURABLE del tráfico que atiende el motor (byok): audit_logs vive en la
      # base del backend, así que la fila se emite al plano interno. Sin esta línea el
      # tráfico de herramientas sólo deja la vitrina efímera de Redis — cero registro
      # durable, el gap más caro del core (detectado en el ensayo 2026-07-27).
      BASA_AUDIT_URL: "http://backend:8000/api/v1/internal/audit"
      # Provider keys DEL CLIENTE (opcionales; viven en secrets.env de la
      # instalación). El alta de modelos referencia os.environ/<VAR> — sin el
      # passthrough el modelo queda dado de alta pero el motor no lo puede usar.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      AZURE_API_KEY: "${AZURE_API_KEY:-}"
      AZURE_API_BASE: "${AZURE_API_BASE:-}"
      AZURE_API_VERSION: "${AZURE_API_VERSION:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    volumes:
      - litellm_config:/app/config:ro          # config.yaml templado + extensions (perfil US3)
    # SIN esto el motor arranca con config default: cero modelos y CERO
    # guardrails/extensiones (hallazgo del ensayo — el volumen montado no
    # basta, hay que decirle al motor que lo use). Las extensiones resuelven
    # relativo al config: /app/config/extensions (populate_volumes las copia).
    entrypoint: ["litellm", "--config", "/app/config/config.yaml"]
    # host-gateway: modelos locales del cliente (runtime en el host de la VM).
    # En Docker Desktop es implícito; en la VM Linux del cliente NO — sin esta
    # línea el modelo local sería inalcanzable en el install real.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Ingress del camino selfhosted: puerta única SPA + API (issue #35, patrón
  #    del VPS). En nube el ingress lo provisiona la 020 US4 (cloud-init) — por
  #    eso vive detrás del profile. La SPA usa /api/v1 relativo y este Caddy lo
  #    enruta al backend en el mismo origen (sin mixed-content, sin puerto fijo).
  ingress:
    profiles: ["selfhosted"]
    image: "${CADDY_IMAGE:-caddy:2-alpine}"
    restart: unless-stopped
    ports:
      - "${INGRESS_HTTP_PORT:-80}:80"
      - "${INGRESS_HTTPS_PORT:-443}:443"
    environment:
      # ":80" = HTTP plano (piloto/LAN); un dominio = TLS automático (ACME).
      INGRESS_HOST: "${INGRESS_HOST:-:80}"
    volumes:
      - ./Caddyfile.ingress:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [backend, frontend]

  # ── SOLO on-prem/air-gap (profile selfhosted): en nube, RDS/ElastiCache via OpenTofu ──
  db:
    profiles: ["selfhosted"]
    image: "${POSTGRES_IMAGE:-postgres:16}"
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?}"
      POSTGRES_USER: "${POSTGRES_USER:?}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"
    volumes:
      - pgdata:/var/lib/postgresql/data        # DURABLE (adiós pgdata efímero de dev)
      - ./initdb:/docker-entrypoint-initdb.d:ro  # crea la base del motor (solo 1er init)

  redis:
    profiles: ["selfhosted"]
    image: "${REDIS_IMAGE:-redis:7-alpine}"
    restart: unless-stopped
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
  licenses:
  litellm_config:
  branding:
  caddy_data:
